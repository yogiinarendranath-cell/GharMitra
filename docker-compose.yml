services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gharmitra-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=GharMitra@2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - gharmitra-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P GharMitra@2026! -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gharmitra-api:latest
    container_name: gharmitra-api
    ports:
      - "5080:5080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5080
      - ConnectionStrings__Default=Server=sqlserver,1433;Database=GharMitraDb;User Id=sa;Password=GharMitra@2026!;TrustServerCertificate=True;MultipleActiveResultSets=true
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  customer:
    build:
      context: ./frontend/customer
      dockerfile: Dockerfile
    image: gharmitra-customer:latest
    container_name: gharmitra-customer
    ports:
      - "5173:80"
    depends_on:
      - api

  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    image: gharmitra-admin:latest
    container_name: gharmitra-admin
    ports:
      - "5174:80"
    depends_on:
      - api

  partner:
    build:
      context: ./frontend/partner
      dockerfile: Dockerfile
    image: gharmitra-partner:latest
    container_name: gharmitra-partner
    ports:
      - "5175:80"
    depends_on:
      - api

volumes:
  gharmitra-sql-data: